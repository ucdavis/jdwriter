# FALLBACK Apple Silicon override for the local SQL service. Prefer Rosetta.
#
# mcr.microsoft.com/mssql/server:2022-latest is amd64-only. Under QEMU on arm64 it
# fails to start at all —
#
#   /opt/mssql/bin/sqlservr: Invalid mapping of address 0x... in reserved address
#   space below 0x400000000000
#
# Under Rosetta it runs normally, so the preferred setup is to turn Rosetta on
# (Docker Desktop setting, or Colima vz + rosetta: true) and use `npm run db:up`.
# See docs/RUNNING-LOCALLY.md. Reported upstream: ucdavis/web-app-template#44.
#
# This file is for machines where Rosetta is unavailable. azure-sql-edge ships a
# native arm64 build and runs the app's EF migrations, but Microsoft has retired it
# and the image does not bundle sqlcmd.
#
# It is ADDITIVE — applied as a second -f after the base compose file:
#
#   npm run db:up:arm64
services:
  sql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    platform: linux/arm64
    # The base file's healthcheck shells out to /opt/mssql-tools*/bin/sqlcmd, which
    # this image does not contain. Probe the TCP port instead — it is what the app
    # actually waits on.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 6s
      timeout: 4s
      retries: 30
