services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/dev.Dockerfile
    volumes:
      - ..:/workspace:cached
    depends_on:
      - sql
    networks:
      - dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sleep infinity
    # ports: # let vscode handle port forwarding
    #   - "5173:5173"
    #   - "5165:5165"

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # amd64-only. Apple Silicon runs it under emulation, which must be Rosetta — under
    # QEMU it aborts at startup. See docs/RUNNING-LOCALLY.md.
    platform: linux/amd64
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev123!"
      MSSQL_PID: "Developer" # can also use "Express" but Developer has more features
    healthcheck:
      # The image ships mssql-tools18 (ODBC 18 encrypts by default, hence -C to trust the
      # self-signed certificate); the old /opt/mssql-tools path no longer exists.
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "LocalDev123!", "-Q", "SELECT 1"]
      interval: 6s
      timeout: 4s
      retries: 30
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - dev
    ports:
      # This machine only: the local database holds the real corpus, and the sa password is in
      # this file. The app container reaches SQL over the compose network, not this port.
      - "127.0.0.1:14333:1433"

  # Optional: Azure Storage's emulator, to run uploads through blob staging as Azure does. Start it
  # with `npm run storage:up` and set Uploads__ConnectionString=UseDevelopmentStorage=true; without
  # it, uploads go straight to the app. See docs/RUNNING-LOCALLY.md.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    volumes:
      - azurite-data:/data
    networks:
      - dev
    ports:
      - "127.0.0.1:10000:10000"

volumes:
  sql-data:
  azurite-data:
  devcontainer-node-modules:
  devcontainer-dotnet-tools:

networks:
  dev:
    driver: bridge
